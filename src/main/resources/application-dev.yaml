# Behind Railway's TLS-terminating proxy: honour X-Forwarded-Proto/Host so generated URLs
# (e.g. springdoc's server url used by Swagger UI) are https instead of http.
server:
  forward-headers-strategy: framework
cors:
  allowed-origins: "https://dev.challengeteamhub.org,https://cthub.up.railway.app"
app:
  security:
      remember-me-key: "${REMEMBER_ME_KEY}"
      admin-password: "${ADMIN_PASSWORD}"
  mail:
    provider: zeptomail
    base-url: "https://dev.challengeteamhub.org"
    zeptomail:
      token: "${ZEPTOMAIL_TOKEN}"
    from:
      address: "noreply@dev.challengeteamhub.org"
      name: "Challenge Team Hub DEV"
    reply-to: "info@dev.challengeteamhub.org"