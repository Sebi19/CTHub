# Behind Railway's TLS-terminating proxy: honour X-Forwarded-Proto/Host so generated URLs
# (e.g. springdoc's server url used by Swagger UI) are https instead of http.
server:
  forward-headers-strategy: framework
cors:
  allowed-origins: "https://challengeteamhub.org,https://cthub.up.railway.app"
app:
  security:
    admin-password: "${ADMIN_PASSWORD}"
    # Base64 256-bit AES key encrypting TOTP secrets; rotating it disables every authenticator app.
    totp-encryption-key: "${TOTP_ENCRYPTION_KEY}"
    webauthn:
      rp-id: "challengeteamhub.org"
      origins:
        - "https://challengeteamhub.org"
  mail:
    provider: zeptomail
    base-url: "https://challengeteamhub.org"
    zeptomail:
      token: "${ZEPTOMAIL_TOKEN}"