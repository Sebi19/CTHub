spring:
  application:
    name: Challenge Team Hub Backend
  datasource:
    # Connects to localhost:5432 (your Docker container)
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ct_hub}
    username: ${PGUSER:dev}
    password: ${PGPASSWORD:dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    # "update": Automatically creates/updates tables based on your Java code
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
springdoc:
  writer-with-default-pretty-printer: true
  remove-broken-reference-definitions: false
management:
  endpoints:
    web:
      exposure:
        include: "health,metrics"
# Prevent Spring Boot's Thymeleaf web-view auto-config from registering on classpath:/templates/ and
# intercepting SpaConfig's 404-to-index.html forwarding. Mail rendering uses its own engine, see
# org.cthub.backend.mail.config.MailAutoConfig.
spring.thymeleaf.enabled: false
app:
  mail:
    enabled: true
    provider: logging
    base-url: "http://localhost:5173"
    from:
      address: "noreply@challengeteamhub.org"
      name: "Challenge Team Hub"
    reply-to: "info@challengeteamhub.org"
    redirect-all-to: ""
    outbox:
      poll-interval: 15s
      batch-size: 25
      max-attempts: 5
      retention-days: 30
    zeptomail:
      base-url: "https://api.zeptomail.eu/v1.1/email"
      token: "${ZEPTOMAIL_TOKEN:}"
  notifications:
    # Read notifications older than this are deleted daily; unread ones are kept.
    retention-days: 90
  push:
    # Web Push (VAPID). Push is disabled unless both keys are set. Generate a pair once per
    # environment (e.g. `npx web-push generate-vapid-keys`) and keep it: rotating the keys
    # invalidates every existing browser subscription.
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:info@challengeteamhub.org}