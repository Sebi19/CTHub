# Shared greeting. The anonymous variant is used until a user has completed their profile,
# since registration only asks for an e-mail address.
mail.greeting=Hi {0},
mail.greeting.anonymous=Hi there,

mail.welcome.subject=Welcome to Challenge Team Hub
mail.welcome.body=your account is now fully set up. Good luck at Challenge Team Hub!

# The e-mailed half of every login / registration / step-up challenge. Deliberately the same text
# whether or not an account exists for the address.
mail.loginLink.subject=Your Challenge Team Hub sign-in link
mail.loginLink.body=click the button to confirm signing in to Challenge Team Hub. If there is no account for this address yet, one will be created.
mail.loginLink.cta=Confirm sign-in
mail.loginLink.expiry=This link is valid for {0} minutes and can only be used once.
mail.loginLink.ignore=If you did not request this, ignore this e-mail. Nothing happens unless the link is clicked.

mail.emailChange.subject=Confirm your new e-mail address
mail.emailChange.body=please confirm that {0} should be the e-mail address of your Challenge Team Hub account from now on.
mail.emailChange.cta=Confirm new address
mail.emailChange.expiry=This link is valid for {0} minutes.
mail.emailChange.ignore=If you did not request this, you can ignore this e-mail.

mail.securityAlert.subject=Security notice for your account
mail.securityAlert.PASSWORD_SET=a password was set for your account.
mail.securityAlert.PASSWORD_CHANGED=the password of your account was changed.
mail.securityAlert.PASSWORD_REMOVED=the password of your account was removed.
mail.securityAlert.TOTP_ENABLED=an authenticator app was set up for your account.
mail.securityAlert.TOTP_DISABLED=the authenticator app was removed from your account.
mail.securityAlert.PASSKEY_ADDED=a new passkey was added to your account.
mail.securityAlert.PASSKEY_REMOVED=a passkey was removed from your account.
mail.securityAlert.EMAIL_CHANGED=the e-mail address of your account was changed. This address will no longer receive messages about the account.
mail.securityAlert.SESSION_REUSE_DETECTED=we detected a suspicious reuse of a sign-in and signed the affected device out to be safe.
mail.securityAlert.device=Device: {0}
mail.securityAlert.notYou=Wasn\u2019t you? Sign in, review your signed-in devices and sign out any you don\u2019t recognise.
mail.securityAlert.cta=Open account settings

# Generic delivery of an in-app notification. The subject is the notification's title. Messages
# with arguments go through MessageFormat, so a literal apostrophe must be written as ''.
mail.notification.subject={0}
mail.notification.cta=View
mail.notification.reason=You are receiving this e-mail because you turned on e-mail notifications for \u201c{0}\u201d.
mail.notification.settingsLink=Change notification settings
mail.notification.type.ANNOUNCEMENT=Announcements
