<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: page(title=#{mail.loginLink.subject}, content=~{::content})}">
<body>
<th:block th:fragment="content">
    <p th:text="${firstName} != null ? #{mail.greeting(${firstName})} : #{mail.greeting.anonymous}">Hi there,</p>
    <p th:text="#{mail.loginLink.body}">Here is your sign-in link.</p>

    <div th:replace="~{components/button.html :: button(url=${loginUrl}, label=#{mail.loginLink.cta})}"></div>

    <div th:replace="~{components/info-box.html :: infoBox(text=#{mail.loginLink.expiry(${validityMinutes})})}"></div>

    <p style="color:#6b7280;font-size:13px;" th:text="#{mail.loginLink.ignore}">
        If you did not request this, you can ignore this e-mail.
    </p>
</th:block>
</body>
</html>
